name: Compilar APK Android 10+ (Control Horario ACE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Aceptar licencias de Android
        run: yes | flutter doctor --android-licenses || true

      - name: Instalar Flet 0.24.1
        run: pip install flet==0.24.1 cookiecutter packaging pyyaml

      - name: Limpiar pyproject.toml y requirements.txt
        run: |
          rm -f requirements.txt
          cat << 'EOF' > pyproject.toml
          [project]
          name = "control-horario-ace"
          version = "20.9.6"
          description = "Control Horario Legal ACE"
          requires-python = ">=3.9"
          dependencies = [
              "flet==0.24.1"
          ]

          [tool.flet]
          org = "es.serviciostecnologicosai"
          product = "Control Horario ACE"
          company = "SERVICIOS TECNOLOGICOS AI, SL"
          copyright = "Copyright (C) 2026 by SERVICIOS TECNOLOGICOS AI, SL"

          [tool.flet.android]
          min_sdk_version = 29
          target_sdk_version = 34
          permissions = ["android.permission.INTERNET"]

          [tool.flet.flutter.dependency_overrides]
          wakelock_plus = "1.2.5"
          wakelock_plus_platform_interface = "1.2.1"
          package_info_plus = "8.0.0"
          EOF

      - name: Preparar plantilla local y fijar dependencias
        run: |
          git clone --branch 0.24.1 \
            https://github.com/flet-dev/flet-build-template.git \
            /tmp/flet-template

          python3 - << 'PY'
          from pathlib import Path
          import yaml

          ruta = Path("/tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml")
          contenido = ruta.read_text(encoding="utf-8")
          lineas = contenido.splitlines(keepends=True)

          inicio = next(
              (i for i, l in enumerate(lineas) if l.startswith("dependency_overrides:")),
              None,
          )

          if inicio is None:
              final = len(lineas)
              overrides = {}
          else:
              final = inicio + 1
              while final < len(lineas):
                  l = lineas[final]
                  if l.strip() and not l[0].isspace() and not l.startswith("#"):
                      break
                  final += 1
              bloque = "".join(lineas[inicio:final])
              try:
                  datos = yaml.safe_load(bloque) or {}
                  overrides = datos.get("dependency_overrides") or {}
              except Exception:
                  overrides = {}

          overrides.update({
              "wakelock_plus": "1.2.5",
              "wakelock_plus_platform_interface": "1.2.1",
              "package_info_plus": "8.0.0",
          })

          nuevo_bloque = yaml.safe_dump(
              {"dependency_overrides": overrides}, sort_keys=False
          )

          if inicio is None:
              resultado = contenido.rstrip() + "\n\n" + nuevo_bloque
          else:
              resultado = (
                  "".join(lineas[:inicio])
                  + nuevo_bloque
                  + "\n"
                  + "".join(lineas[final:])
              )

          ruta.write_text(resultado, encoding="utf-8")
          print("Dependencias fijadas en la plantilla:")
          print(nuevo_bloque)
          PY

      - name: Mostrar pubspec.yaml final de la plantilla
        run: cat "/tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml"

      - name: Compilar APK
        run: flet build apk --template /tmp/flet-template --verbose --no-rich-output

      - name: Subir archivo final
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
