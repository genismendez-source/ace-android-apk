name: Compilar APK Android 10+ (Control Horario ACE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Flet y librerias
        run: pip install flet==0.24.1 cryptography==41.0.7

      - name: Compilar APK (Flet Action)
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          project-dir: .

      - name: Subir archivo final
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
