name: Compilar APK Android 10+ (Control Horario ACE)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.4"

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Instalar Flet 0.27.6
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.27.6"

      - name: Preparar configuracion de Flet
        run: |
          rm -f requirements.txt

          cat > pyproject.toml << 'EOF'
          [project]
          name = "control-horario-ace"
          version = "20.9.6"
          description = "Control Horario Legal ACE"
          requires-python = ">=3.9"
          dependencies = [
              "flet==0.27.6"
          ]

          [tool.flet]
          org = "es.serviciostecnologicosai"
          product = "Control Horario ACE"
          company = "SERVICIOS TECNOLOGICOS AI, SL"
          copyright = "Copyright (C) 2026 by SERVICIOS TECNOLOGICOS AI, SL"

          [tool.flet.android]
          min_sdk_version = 29
          target_sdk_version = 34
          permissions = ["android.permission.INTERNET"]
          EOF

      - name: Mostrar versiones del entorno
        run: |
          python --version
          flutter --version
          python -m pip show flet

      - name: Compilar APK
        run: |
          set -o pipefail

          flet build apk \
            --verbose \
            --no-rich-output \
            2>&1 | tee "$RUNNER_TEMP/compilacion-apk.log"

      - name: Guardar registro de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Registro-compilacion-Android
          path: ${{ runner.temp }}/compilacion-apk.log
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error
