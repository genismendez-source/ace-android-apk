name: Compilar APK Android 10+ (Control Horario ACE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Aceptar licencias de Android
        run: yes | flutter doctor --android-licenses || true

      - name: Instalar Flet 0.24.1 y flet-cli explícitamente
        run: pip install flet==0.24.1 flet-cli==0.24.1

      - name: Bloquear wakelock_plus 1.2.5 en la plantilla de Flet
        run: |
          git clone --depth 1 --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/plantilla_flet
          cat << 'EOF' >> /tmp/plantilla_flet/{{cookiecutter.out_dir}}/pubspec.yaml

          dependency_overrides:
            wakelock_plus: 1.2.5
            wakelock_plus_platform_interface: 1.2.1
            package_info_plus: 8.0.0
            win32: 5.5.4
          EOF

      - name: Limpiar pyproject.toml y requirements.txt
        run: |
          rm -f requirements.txt
          cat << 'EOF' > pyproject.toml
          [project]
          name = "control-horario-ace"
          version = "20.9.6"
          description = "Control Horario Legal ACE"
          requires-python = ">=3.9"
          dependencies = ["flet==0.24.1"]

          [tool.flet]
          org = "es.serviciostecnologicosai"
          product = "Control Horario ACE"

          [tool.flet.android]
          min_sdk_version = 29
          target_sdk_version = 34
          permissions = ["android.permission.INTERNET"]
          EOF

      - name: Compilar APK usando plantilla parcheada
        run: flet build apk --template-dir /tmp/plantilla_flet --verbose --no-rich-output

      - name: Subir archivo final
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
