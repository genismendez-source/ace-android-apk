[project]
name = "control-horario-ace"
version = "20.9.6"
description = "Control Horario Legal ACE (Art. 34.9 ET) - Android 10+ Cloud Sync"
requires-python = ">=3.9"
authors = [
    { name = "SERVICIOS TECNOLOGICOS AI, SL" }
]
dependencies = [
    "flet==0.24.1"
]

[tool.flet]
org = "es.serviciostecnologicosai"
product = "Control Horario ACE"
company = "SERVICIOS TECNOLOGICOS AI, SL"
copyright = "Copyright (C) 2026 by SERVICIOS TECNOLOGICOS AI, SL"

[tool.flet.android]
min_sdk_version = 29
target_sdk_version = 34
permissions = ["android.permission.INTERNET"]

[tool.flet.flutter.pubspec.dependency_overrides]
wakelock_plus = "1.2.8"
package_info_plus = "8.0.2"
