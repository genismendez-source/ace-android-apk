name: Compilar APK Android 10+ (Control Horario ACE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar APK con motor oficial
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      - name: Subir instalador final
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
