name: Compilar APK Android 10+ (Control Horario ACE)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.1"

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Instalar herramientas de compilacion
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "flet==0.24.1" \
            cookiecutter \
            packaging \
            PyYAML

      - name: Preparar configuracion de Flet
        run: |
          rm -f requirements.txt

          cat > pyproject.toml << 'EOF'
          [project]
          name = "control-horario-ace"
          version = "20.9.6"
          description = "Control Horario Legal ACE"
          requires-python = ">=3.9"
          dependencies = [
              "flet==0.24.1"
          ]

          [tool.flet]
          org = "es.serviciostecnologicosai"
          product = "Control Horario ACE"
          company = "SERVICIOS TECNOLOGICOS AI, SL"
          copyright = "Copyright (C) 2026 by SERVICIOS TECNOLOGICOS AI, SL"

          [tool.flet.android]
          min_sdk_version = 29
          target_sdk_version = 34
          permissions = ["android.permission.INTERNET"]
          EOF

      - name: Descargar plantilla de Flet 0.24.1
        run: |
          git clone \
            --depth 1 \
            --branch 0.24.1 \
            https://github.com/flet-dev/flet-build-template.git \
            /tmp/flet-template

      - name: Corregir versiones en la plantilla
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import yaml

          ruta = Path(
              "/tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml"
          )

          if not ruta.is_file():
              raise SystemExit(
                  f"No se encuentra el archivo de plantilla: {ruta}"
              )

          contenido = ruta.read_text(encoding="utf-8")
          lineas = contenido.splitlines(keepends=True)

          inicio = next(
              (
                  i
                  for i, linea in enumerate(lineas)
                  if linea.startswith("dependency_overrides:")
              ),
              None,
          )

          if inicio is None:
              final = len(lineas)
              overrides = {}
          else:
              final = inicio + 1

              while final < len(lineas):
                  linea = lineas[final]

                  if (
                      linea.strip()
                      and not linea[0].isspace()
                      and not linea.startswith("#")
                  ):
                      break

                  final += 1

              bloque = "".join(lineas[inicio:final])
              datos = yaml.safe_load(bloque) or {}
              overrides = datos.get("dependency_overrides") or {}

              if not isinstance(overrides, dict):
                  raise SystemExit(
                      "dependency_overrides no tiene el formato esperado"
                  )

          overrides.update(
              {
                  "wakelock_plus": "1.2.5",
                  "wakelock_plus_platform_interface": "1.2.1",
                  "package_info_plus": "8.0.0",
              }
          )

          nuevo_bloque = yaml.safe_dump(
              {"dependency_overrides": overrides},
              sort_keys=False,
          )

          if inicio is None:
              resultado = (
                  contenido.rstrip()
                  + "\n\n"
                  + nuevo_bloque
              )
          else:
              resultado = (
                  "".join(lineas[:inicio])
                  + nuevo_bloque
                  + "\n"
                  + "".join(lineas[final:])
              )

          ruta.write_text(resultado, encoding="utf-8")

          print("Versiones fijadas en la plantilla:")
          print(nuevo_bloque)
          PY

      - name: Mostrar versiones del entorno
        run: |
          python --version
          flutter --version
          python -m pip show flet

      - name: Compilar APK
        run: |
          set -o pipefail

          flet build apk \
            --template /tmp/flet-template \
            --verbose \
            --no-rich-output \
            2>&1 | tee "$RUNNER_TEMP/compilacion-apk.log"

      - name: Guardar registro de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Registro-compilacion-Android
          path: ${{ runner.temp }}/compilacion-apk.log
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error
