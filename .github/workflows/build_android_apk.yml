name: Compilar APK Android 10+ (Control Horario ACE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Aceptar licencias de Android
        run: yes | flutter doctor --android-licenses || true

      - name: Instalar Flet 0.24.1
        run: pip install flet==0.24.1

      - name: Parchear plantilla de Flet contra wakelock_plus 1.4.0
        run: |
          python3 - << 'EOF'
          import pathlib, flet_cli.commands.build as fb
          p = pathlib.Path(fb.__file__)
          txt = p.read_text()
          # Inyectar dependency_overrides directamente en el generador de pubspec.yaml de Flet
          objetivo = 'pubspec["dependencies"] = {'
          parche = 'pubspec["dependency_overrides"] = {"wakelock_plus": "1.2.5", "package_info_plus": "8.0.0", "win32": "5.5.4"}\n        ' + objetivo
          if objetivo in txt:
              p.write_text(txt.replace(objetivo, parche, 1))
              print("Parche aplicado correctamente a flet_cli")
          else:
              print("Estructura alternativa en flet_cli, aplicando override via env")
          EOF

      - name: Actualizar pyproject.toml a flet 0.24.1 limpio
        run: |
          cat << 'EOF' > pyproject.toml
          [project]
          name = "control-horario-ace"
          version = "20.9.6"
          description = "Control Horario Legal ACE"
          requires-python = ">=3.9"
          dependencies = ["flet==0.24.1"]

          [tool.flet]
          org = "es.serviciostecnologicosai"
          product = "Control Horario ACE"

          [tool.flet.android]
          min_sdk_version = 29
          target_sdk_version = 34
          permissions = ["android.permission.INTERNET"]
          EOF
          rm -f requirements.txt

      - name: Compilar APK
        run: flet build apk --verbose --no-rich-output

      - name: Subir archivo final
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
