name: Compilar APK Android 10+ (Control Horario ACE Cloud Sync)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Compilar APK usando Flet Oficial
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      - name: Subir APK al final
        uses: actions/upload-artifact@v4
        with:
          name: ControlHorarioACE-Android-APK
          path: build/apk/*.apk
